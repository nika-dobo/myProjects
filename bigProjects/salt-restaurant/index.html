<!DOCTYPE html>
<html lang="ka" class="dark">
<head>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

            fontFamily: {

              sans: ['"Noto Sans Georgian"', '"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif']

          }
